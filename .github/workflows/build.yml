name: Build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Dependency audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e "try { const a = require('./npm-audit.json'); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log(name + ': ' + v.severity + ' (range ' + v.range + ', fix ' + JSON.stringify(v.fixAvailable) + ')'); console.log('Total:', JSON.stringify(a.metadata?.vulnerabilities || {})); } catch { console.log('npm audit report unavailable'); }"
      - run: npm run build
